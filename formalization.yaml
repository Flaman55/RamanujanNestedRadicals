version: "v0.4"

license: "Apache-2.0"

project:
  name: "RamanujanNestedRadicals: convergence and exact values of Ramanujan-type nested radicals"
  description: >
    Lean 4 / Mathlib formalization of the results of the author's paper "Nested Radicals of
    Ramanujan's Type with Arbitrary Coefficient Sequences" (Flamandzki, 2026). For a coefficient
    sequence a : N -> R, the radical of depth d is built by the recursion R_k = sqrt(1 + a_k
    R_{k+1}) from a seed; `Submission.rollUp a T d` is the depth-d truncation with seed T and
    `Submission.truncRadical a d` uses the seed 1. For a root order n >= 2 the square root is
    replaced by the n-th root (`Submission.rollUpN`) and, for the classical unbounded family,
    by the signed recursion with radicand (-1)^n + a_k R_{k+1} (`Submission.rollUpNS`), whose
    coefficients are a_k = altSum n (N + k - 1) for the alternating polynomial altSum n x =
    x^(n-1) - x^(n-2) + ... +- 1. Four statements are submitted: (1) for real N >= 2 and a_k = N
    + k - 2 the square-root truncations converge to exactly N (for N = 3 this is Ramanujan's
    radical; the statement is known, see the sources, and is the base case); (2) for every root
    order n >= 2, both parities, the truncations of the signed family converge to exactly N,
    which is not treated in the sources listed below (the only place where parity enters is the sign
    (-1)^n); (3) an arbitrary-profile theorem: if R_k >= 1 and the coefficients are the ones for
    which R satisfies the recursion exactly, R_k^n = 1 + a_k R_{k+1}, then the depth-d
    truncation with seed 1 satisfies 0 <= R_1 - T_d <= R_1 prod_{j<d} (1 - 1/R_j), and it
    converges to exactly R_1 whenever the sum of 1/R_k diverges (it contains every constant
    profile and the classical family for every even n, with an explicit rate; it is not stated
    in version 2 of the paper (10.5281/zenodo.18071173); version 3
    (10.5281/zenodo.23546920) states it). The development
    (`RamanujanNested/`, 24 modules) contains further results that are not advertised in
    `Challenge.lean`: boundedness and monotonicity, controlled negative coefficients, the
    inverse construction, the closed-form identity chain for every n, the constant-coefficient
    exact-target radical for every n, an oscillatory family, and existence of a limit for
    linear and prime coefficient families at every root order.
    The paper's numerical tables, algorithms as running code, and informal discussion are not
    formalized. Zero sorries; depends only on the three standard Lean axioms.
  authors: ["Artur Flamandzki"]
  license: "Apache-2.0"
  responsible_maintainers: ["Artur Flamandzki"]
  repository_role: >
    Substantive development: this repository contains the complete, self-contained Lean
    development together with the accompanying paper.

classification:
  arxiv: ["math.CA", "math.NT"]
  msc2020: ["40A05"]

sources:
  - title: "Nested Radicals of Ramanujan's Type with Arbitrary Coefficient Sequences"
    authors: ["Artur Flamandzki"]
    id: "https://doi.org/10.5281/zenodo.23546920"
    type: "paper"
    location: "Sections on convergence criteria, the classical unbounded family, exact value, higher-order roots and the constant-coefficient target construction"
    author_endorsement: "n/a"
    relationship: "formalizes"
    note: >
      The author's own paper (self-published preprint on Zenodo, not peer reviewed; LaTeX
      sources and PDF in `Latex/`) is the source of every advertised statement. The paper
      develops a general framework for nested radicals with arbitrary coefficient sequences,
      sufficient conditions for convergence (boundedness and monotonicity, a lemma for
      controlled negative coefficients), a moving-ceiling argument and a functional-equation
      argument that prove exact convergence for the unbounded family a_k = N + k - 2, and an
      independent constant-coefficient construction converging to a prescribed target with a
      geometric rate. Version 2 of the paper was revised after the Lean formalization found
      two errors in version 1 (an attribution of the classical radical to a boundedness
      criterion whose hypothesis it does not satisfy, and an indexing error in a displayed
      formula); see `README.md`. Results for root order n >= 2 (the closed form for both
      parities, the exact limit N for both parities, the target construction) are stated in
      prose in the paper and proved in Lean; the odd-n exact limit needs an additional
      product bound that is proved only in the Lean development. The arbitrary-profile
      theorem (`ProfileGap.lean`, advertised result (3)) is not in version 2 of the paper: it
      covers the exact-target construction and the classical family for even n as special cases
      and adds an explicit convergence rate; version 3 of the paper (10.5281/zenodo.23546920)
      states it.
      Intended audience: researchers working on nested radicals, Ramanujan-type identities and
      convergence of continued-radical expressions, and readers interested in formal
      verification of classical analysis. Literature check: the sources below were read and the
      relationship to this work is described per source. No search for earlier formalizations
      of these statements was carried out beyond reading the cited works; this is not a claim
      of novelty.
  - title: "On Infinite Radicals"
    authors: ["Aaron Herschfeld"]
    id: "doi:10.1080/00029890.1935.11987745"
    type: "paper"
    location: "The Amer. Math. Monthly 42 (1935), 419-429"
    author_endorsement: "n/a"
    relationship: "background"
    note: >
      Classical convergence criterion for infinite nested radicals. The exact-value argument
      for a_k = N + k - 2 in this development is a self-contained deficit-growth argument in
      the same spirit and does not apply Herschfeld's criterion. The convergence of Ramanujan's
      classical radical to 3 is a long-known result; this development gives a machine-checked
      proof of the square-root case (known) and of the general-n statement.
  - title: "On Generalized Ramanujan-Style Nested Radicals for All Integers"
    authors: ["Charles Kusniec"]
    id: "https://doi.org/10.5281/zenodo.18044559"
    type: "paper"
    location: "Sections 5 and 7 (Radiciatory constructions), Section 6 (examples)"
    author_endorsement: "not-contacted"
    relationship: "independently-proves"
    note: >
      Zenodo preprint, version v7 of 24 December 2025 (open access), the version read for this
      work. Intended
      audience: readers of elementary number theory and recreational and educational
      mathematics interested in Ramanujan-type identities.
      Square roots only. With q = 1 his family is the coefficient family a_k = N + k - 2 of
      advertised result (1) (x playing the role of N), so that statement is known there. His
      truncations are closed with the exact tail sqrt(p_n^2) = p_n, so every truncation equals x
      identically and the identity R(x, 1) = x holds by finite telescoping; the paper itself
      calls the passage to the limit informal. The convergence of the standard truncation (seed 1)
      is not analysed there. No root order n >= 3 appears. Results (2) and (3) are not in this
      source. Here the same statement is proved for the standard truncation by a moving ceiling
      plus a deficit-growth contradiction.
  - title: "Generalization of Ramanujan's Famous Nested Radicals to the nth Root and their Evaluation"
    authors: ["Narendranath Mitra"]
    id: "arXiv:2404.04051"
    type: "paper"
    location: "Sections 1.1-1.4 (the n-th root theorem) and Section 2 (cube-root proof)"
    author_endorsement: "not-contacted"
    relationship: "background"
    note: >
      arXiv preprint (math.GM), version v1, April 2024. Intended audience: readers of
      Ramanujan's nested radicals and their generalizations.
      Higher-order roots with a different recursion: f(x)^n = (1 + C(n,1) x + ... + C(n,n-2)
      x^(n-2)) + x^(n-1) f(x + n - 1), i.e. the radicand is a row of Pascal's triangle with the
      argument shifted by n - 1, and f(x) = x + 1. It is not of the form 1 + a_k R_{k+1} used
      here for n >= 3. For n = 2 it is Ramanujan's family (a_k = N + k - 2); the n = 2 case is
      cited there (Andreescu-Gelca, Small), not proved. Convergence is proved only for n = 3
      (bounds with factors 2^(+-3/2), then iteration); for n >= 4 the paper says "proceeding
      similarly". Advertised results (2) and (3) concern a different recursion and are not
      contained in this source.
  - title: "Variations on Ramanujan's Nested Radicals"
    authors: ["Geoffrey B. Campbell", "Aleksander Zujev"]
    id: "arXiv:1511.06865"
    type: "paper"
    location: "Sections 2 and 3"
    author_endorsement: "not-contacted"
    relationship: "background"
    note: >
      arXiv preprint (math.NT), version v1, November 2015. Intended audience: readers of
      Ramanujan's radical identities and units in number fields.
      Finite algebraic radical identities and constructions of such identities; no infinite
      nested radical and no convergence statement. Context only.
  - title: "Notebooks of Srinivasa Ramanujan (Berndt, Ramanujan's Notebooks, Part II, p. 108, Entry 4)"
    authors: ["Srinivasa Ramanujan", "Bruce C. Berndt (editor)"]
    type: "book"
    id: "Springer, New York, 1989 (Part II)"
    location: "Part II, p. 108, Entry 4"
    author_endorsement: "n/a"
    relationship: "independently-proves"
    note: >
      Source of the classical radical sqrt(1 + 2 sqrt(1 + 3 sqrt(1 + ...))) = 3 and, through the
      general Entry 4 as quoted in Mitra's paper, of the family a_k = N + k - 2 for square roots
      (f(x) = x + 1; rigorous proofs of f(x) = x + 1 are cited there from Andreescu-Gelca and
      Small, which this author has not read). Advertised result (1) is therefore known; this
      development proves it independently and machine-checks it.

status:
  scope: >
    Scope of the advertised results. The advertised statements are the general ones: the
    classical family for every root order, with one recursion whose radicand is
    (-1)^n + a_k R_{k+1} and a single coefficient a_k = altSum n (N + k - 1), and the
    arbitrary-profile theorem. Elementary variants (the constant-coefficient target radical,
    boundedness for bounded coefficients, the closed-form identity chain, the n = 2 square-root
    case) are not presented as results to be proved; they lie inside the covered space and
    appear in the development only where the proofs need them or as special cases (for example
    every constant profile R_k = t is a case of the profile theorem). Structurally this differs
    from constructions built on the binomial expansion of (x + 1)^n, where the radicand is a
    full row of Pascal's triangle and changes with n; here the shape of the recursion is the
    same for every n and only the scalar coefficient and the sign (-1)^n change.

    Four declarations are submitted for Comparator review (see comparator.json). All are
    stated in Challenge.lean over definitions that are given there in full and proved in
    Solution.lean, which imports the development in `RamanujanNested/`. Each definition of
    Solution.lean is shown equal to its counterpart in the `RamanujanNested` namespace and the
    statements are discharged by the corresponding theorems there.

    `truncRadical_classical_tendsto` (for a_k = N + k - 2, real N >= 2): a moving-ceiling
    induction shows the truncation at depth d is bounded by N, so the truncations have a limit
    L(N) <= N (UnboundedChain.lean); the limit satisfies the functional equation L(N) =
    sqrt(1 + (N - 1) L(N + 1)); the deficit delta(N) = N - L(N) satisfies delta(N + 1) >=
    delta(N) (N + 1)/(N - 1), hence grows quadratically along N, N + 1, ..., against the
    linear ceiling delta(N + j) <= N + j - 1; this contradicts delta(N) > 0 and gives L(N) = N
    (HerschfeldClosure.lean).

    `truncRadicalNS_tendsto`: with R_k = N + k - 1 and altSum n x (x + 1) = x^n - (-1)^n the
    radicand (-1)^n + altSum n R_k R_{k+1} equals R_k^n exactly (IdentityChainNthRoot.lean).
    The signed family keeps the truncations in [1, N] (the seed 0 fails for odd n because the
    radicand can go negative), so the truncations are monotone and converge; the deficit
    argument of the square-root case transfers for even n using altSum n N exactly, and for odd
    n an extra per-step shrink factor 1 - 2/(N^n + 1) appears, whose product over j steps is
    bounded below by 1/2 uniformly in j (an elementary telescoping estimate and a Weierstrass-type
    product-sum inequality), which keeps the deficit growth quadratic.

    `rollUpN_profile_gap` and `rollUpN_profile_tendsto` (ProfileGap.lean): with s the depth-(d+1)
    truncation and u the depth-d truncation of the shifted problem, R_1^n - s^n = a_1 (R_2 - u)
    and s >= 1 give R_1 - s <= (R_1 - 1)(R_2 - u)/R_2, by the geometric-sum factorization
    x^n - y^n = (x - y) sum x^i y^(n-1-i). Induction on d telescopes this into R_1 - T_d <=
    R_1 prod_{j<d} (1 - 1/R_j). Since 1 - x <= exp(-x), the product is at most
    exp(-sum_{j<d} 1/R_j), which tends to 0 exactly when the sum of 1/R_k diverges; squeezing
    gives convergence to R_1. No limit object, functional equation or deficit-growth argument is
    used. Special cases: R_k = t (constant, seed 1) and R_k = N + k - 1 with even n, whose rate
    for n = 2 is N (N - 1)/(N + d - 1).
